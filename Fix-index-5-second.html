<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Deteksi Bahasa Isyarat</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-100 flex flex-col items-center justify-center min-h-screen"
  >
    <h1 class="text-3xl font-bold text-gray-800 mb-4">
      🤟 Deteksi Bahasa Isyarat Realtime
    </h1>

    <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-lg text-center">
      <video
        id="video"
        autoplay
        playsinline
        class="rounded-xl w-full h-64 object-cover border-2 border-gray-300"
      ></video>

      <canvas id="canvas" class="hidden"></canvas>

      <div id="resultContainer" class="mt-6">
        <img id="resultImage" class="w-full rounded-lg shadow-md border" />
        <ul
          id="detectionsList"
          class="mt-3 text-left list-disc list-inside text-gray-700"
        ></ul>
      </div>

      <button
        id="startButton"
        class="mt-4 bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition"
      >
        🎥 Nyalakan Kamera
      </button>
    </div>

    <footer class="mt-6 text-sm text-gray-500">
      Dibuat dengan 💙 oleh Faruqi Rabbani
    </footer>

    <script>
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const startButton = document.getElementById("startButton");
      const resultImage = document.getElementById("resultImage");
      const detectionsList = document.getElementById("detectionsList");

      // 🔗 Ganti URL ngrok kamu di sini
      const API_URL = "https://4dbffd36272e.ngrok-free.app/detect";

      let isRunning = false;

      startButton.onclick = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
          });
          video.srcObject = stream;
          startButton.disabled = true;
          startButton.textContent = "🧠 Deteksi sedang berjalan...";
          isRunning = true;
          startRealtimeDetection();
        } catch (err) {
          alert("Tidak dapat mengakses kamera: " + err);
        }
      };

      // === Fungsi deteksi realtime ===
      async function startRealtimeDetection() {
        const context = canvas.getContext("2d");

        async function detectFrame() {
          if (!isRunning) return;

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = canvas.toDataURL("image/jpeg");

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ image: imageData }),
            });

            const result = await response.json();
            if (!result.error) {
              resultImage.src = result.image;
              detectionsList.innerHTML = "";

              if (result.detections.length === 0) {
                detectionsList.innerHTML = "<li>Tidak ada deteksi.</li>";
              } else {
                result.detections.forEach((det) => {
                  const li = document.createElement("li");
                  li.textContent = `${det.label} (${(
                    det.confidence * 100
                  ).toFixed(1)}%)`;
                  detectionsList.appendChild(li);
                });
              }
            }
          } catch (err) {
            console.error("Gagal deteksi:", err);
          }

          setTimeout(detectFrame, 1); // kirim frame tiap 0.5 detik
        }

        detectFrame();
      }
    </script>
  </body>
</html>
