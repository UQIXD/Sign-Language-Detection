<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Deteksi Bahasa Isyarat</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-100 flex flex-col items-center justify-center min-h-screen"
  >
    <h1 class="text-3xl font-bold text-gray-800 mb-4">
      🤟 Deteksi Bahasa Isyarat Realtime
    </h1>

    <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-lg text-center">
      <video
        id="video"
        autoplay
        playsinline
        class="rounded-xl w-full h-64 object-cover border-2 border-gray-300"
      ></video>

      <canvas id="canvas" class="hidden"></canvas>

      <div id="resultContainer" class="mt-6">
        <img id="resultImage" class="w-full rounded-lg shadow-md border" />

        <!-- Container untuk deteksi saat ini -->
        <div class="mt-4">
          <h3 class="font-bold text-lg text-gray-700 mb-2">
            Deteksi Saat Ini:
          </h3>
          <ul
            id="detectionsList"
            class="text-left list-disc list-inside text-gray-700"
          ></ul>
        </div>

        <!-- Container untuk history deteksi -->
        <div class="mt-6 border-t pt-4">
          <h3 class="font-bold text-lg text-gray-700 mb-2">
            📊 History 5 Deteksi Terbaik per Class:
          </h3>
          <div id="historyContainer" class="space-y-3"></div>
        </div>
      </div>

      <div class="flex gap-2 mt-4">
        <button
          id="startButton"
          class="flex-1 bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition"
        >
          🎥 Nyalakan Kamera
        </button>
        <button
          id="clearHistoryButton"
          class="flex-1 bg-gray-500 text-white px-5 py-2 rounded-lg hover:bg-gray-600 transition"
        >
          🗑️ Clear History
        </button>
      </div>
    </div>

    <footer class="mt-6 text-sm text-gray-500">
      Dibuat dengan 💙 oleh Faruqi Rabbani
    </footer>

    <script>
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const startButton = document.getElementById("startButton");
      const clearHistoryButton = document.getElementById("clearHistoryButton");
      const resultImage = document.getElementById("resultImage");
      const detectionsList = document.getElementById("detectionsList");
      const historyContainer = document.getElementById("historyContainer");

      // 🔗 Ganti URL ngrok kamu di sini
      const API_URL = "https://simona-wraithlike-alicia.ngrok-free.dev/detect";

      // Objek untuk menyimpan history per class
      let detectionHistory = {};
      const MAX_HISTORY_PER_CLASS = 5;
      let isRunning = false;

      // Fungsi untuk menyimpan hasil deteksi ke history
      function saveToHistory(detections) {
        detections.forEach((det) => {
          const className = det.label;
          const confidence = parseFloat((det.confidence * 100).toFixed(1));

          if (!detectionHistory[className]) {
            detectionHistory[className] = [];
          }

          // Cek apakah deteksi ini sudah ada (berdasarkan timestamp atau posisi)
          const existingIndex = detectionHistory[className].findIndex(
            (item) => Math.abs(item.confidence - confidence) < 0.1,
          );

          if (existingIndex === -1) {
            // Tambah deteksi baru
            detectionHistory[className].push({
              confidence: confidence,
              timestamp: new Date().toLocaleTimeString(),
            });

            // Urutkan berdasarkan confidence (tertinggi ke terendah)
            detectionHistory[className].sort(
              (a, b) => b.confidence - a.confidence,
            );

            // Hapus yang terendah jika lebih dari MAX_HISTORY_PER_CLASS
            if (detectionHistory[className].length > MAX_HISTORY_PER_CLASS) {
              detectionHistory[className].pop();
            }
          }
        });

        // Update tampilan history
        updateHistoryDisplay();
      }

      // Fungsi untuk menampilkan history
      function updateHistoryDisplay() {
        historyContainer.innerHTML = "";

        // Ambil semua class yang ada
        const classes = Object.keys(detectionHistory).sort();

        if (classes.length === 0) {
          historyContainer.innerHTML = `
            <div class="text-gray-500 italic">
              Belum ada history deteksi. Mulai kamera untuk melihat history.
            </div>
          `;
          return;
        }

        classes.forEach((className) => {
          const historyDiv = document.createElement("div");
          historyDiv.className = "bg-gray-50 p-3 rounded-lg border";

          const title = document.createElement("div");
          title.className = "font-semibold text-blue-600 mb-1";
          title.textContent = `Huruf: ${className}`;
          historyDiv.appendChild(title);

          const list = document.createElement("div");
          list.className = "space-y-1 text-sm";

          detectionHistory[className].forEach((item, index) => {
            const itemDiv = document.createElement("div");
            itemDiv.className = "flex justify-between items-center";

            const confidenceBar = document.createElement("div");
            confidenceBar.className =
              "flex-1 bg-gray-200 rounded-full h-2 mr-2";

            const fillBar = document.createElement("div");
            fillBar.className = "bg-green-500 h-2 rounded-full";
            fillBar.style.width = `${item.confidence}%`;
            confidenceBar.appendChild(fillBar);

            const text = document.createElement("span");
            text.className = "text-gray-700 font-medium";
            text.textContent = `${item.confidence}%`;

            const time = document.createElement("span");
            time.className = "text-gray-500 text-xs";
            time.textContent = item.timestamp;

            itemDiv.appendChild(confidenceBar);
            itemDiv.appendChild(text);
            itemDiv.appendChild(time);
            list.appendChild(itemDiv);
          });

          historyDiv.appendChild(list);
          historyContainer.appendChild(historyDiv);
        });
      }

      // Fungsi untuk menghapus history
      function clearHistory() {
        detectionHistory = {};
        updateHistoryDisplay();
        alert("History deteksi telah dihapus!");
      }

      // Event listener untuk tombol clear history
      clearHistoryButton.onclick = clearHistory;

      // Event listener untuk tombol start
      startButton.onclick = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
          });
          video.srcObject = stream;
          startButton.disabled = true;
          startButton.textContent = "🧠 Deteksi sedang berjalan...";
          isRunning = true;
          startRealtimeDetection();
        } catch (err) {
          alert("Tidak dapat mengakses kamera: " + err);
        }
      };

      // === Fungsi deteksi realtime ===
      async function startRealtimeDetection() {
        const context = canvas.getContext("2d");
        let isProcessing = false;

        async function detectFrame() {
          if (!isRunning || isProcessing)
            return requestAnimationFrame(detectFrame);
          isProcessing = true;

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = canvas.toDataURL("image/jpeg", 0.5); // compress agar lebih cepat

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ image: imageData }),
            });

            const result = await response.json();
            if (!result.error) {
              resultImage.src = result.image;
              detectionsList.innerHTML = "";

              if (result.detections && result.detections.length === 0) {
                detectionsList.innerHTML = "<li>Tidak ada deteksi.</li>";
              } else if (result.detections) {
                // Tampilkan deteksi saat ini
                result.detections.forEach((det) => {
                  const li = document.createElement("li");
                  li.className = "mb-1";
                  li.textContent = `${det.label} (${(
                    det.confidence * 100
                  ).toFixed(1)}%)`;
                  detectionsList.appendChild(li);
                });

                // Simpan ke history
                saveToHistory(result.detections);
              }
            }
          } catch (err) {
            console.error("Gagal deteksi:", err);
          } finally {
            isProcessing = false;
            requestAnimationFrame(detectFrame); // panggil frame berikutnya secepatnya
          }
        }

        detectFrame();
      }

      // Inisialisasi tampilan history kosong
      updateHistoryDisplay();
    </script>
  </body>
</html>
