<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Deteksi Bahasa Isyarat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .history-container {
        max-height: 400px;
        overflow-y: auto;
      }
      table {
        font-size: 14px;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4"
  >
    <h1 class="text-3xl font-bold text-gray-800 mb-4">
      🤟 Deteksi Bahasa Isyarat Realtime
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full max-w-6xl">
      <!-- Kolom Kiri: Video & Deteksi -->
      <div class="bg-white shadow-xl rounded-2xl p-6 text-center">
        <video
          id="video"
          autoplay
          playsinline
          class="rounded-xl w-full h-64 object-cover border-2 border-gray-300"
        ></video>

        <canvas id="canvas" class="hidden"></canvas>

        <div id="resultContainer" class="mt-6">
          <img id="resultImage" class="w-full rounded-lg shadow-md border" />
          <ul
            id="detectionsList"
            class="mt-3 text-left list-disc list-inside text-gray-700"
          ></ul>
        </div>

        <button
          id="startButton"
          class="mt-4 bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition"
        >
          🎥 Nyalakan Kamera
        </button>

        <button
          id="clearButton"
          class="mt-4 ml-2 bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700 transition"
        >
          🗑️ Hapus History
        </button>
      </div>

      <!-- Kolom Kanan: History Table -->
      <div class="bg-white shadow-xl rounded-2xl p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">
          📊 History Top 5 Deteksi
        </h2>
        <div id="historyContainer" class="history-container">
          <p class="text-center text-gray-500">Belum ada riwayat deteksi</p>
        </div>
      </div>
    </div>

    <footer class="mt-6 text-sm text-gray-500">
      Dibuat dengan 💙 oleh Faruqi Rabbani
    </footer>

    <script>
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const startButton = document.getElementById("startButton");
      const clearButton = document.getElementById("clearButton");
      const resultImage = document.getElementById("resultImage");
      const detectionsList = document.getElementById("detectionsList");
      const historyContainer = document.getElementById("historyContainer");

      // 🔗 Ganti URL ngrok kamu di sini
      const API_URL = "https://simona-wraithlike-alicia.ngrok-free.dev/detect";
      const HISTORY_URL =
        "https://simona-wraithlike-alicia.ngrok-free.dev/history";
      const CLEAR_URL =
        "https://simona-wraithlike-alicia.ngrok-free.dev/clear-history";

      let isRunning = false;

      startButton.onclick = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
          });
          video.srcObject = stream;
          startButton.disabled = true;
          startButton.textContent = "🧠 Deteksi sedang berjalan...";
          isRunning = true;
          startRealtimeDetection();
        } catch (err) {
          alert("Tidak dapat mengakses kamera: " + err);
        }
      };

      clearButton.onclick = async () => {
        if (confirm("Yakin ingin menghapus semua history?")) {
          try {
            await fetch(CLEAR_URL, { method: "POST" });
            historyContainer.innerHTML =
              "<p class='text-center text-gray-500'>Belum ada riwayat deteksi</p>";
            alert("History berhasil dihapus!");
          } catch (err) {
            alert("Gagal menghapus history: " + err);
          }
        }
      };

      // === Fungsi deteksi realtime ===
      async function startRealtimeDetection() {
        const context = canvas.getContext("2d");
        let isProcessing = false;

        async function detectFrame() {
          if (!isRunning || isProcessing)
            return requestAnimationFrame(detectFrame);
          isProcessing = true;

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = canvas.toDataURL("image/jpeg", 0.5);

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ image: imageData }),
            });

            const result = await response.json();
            if (!result.error) {
              resultImage.src = result.image;
              detectionsList.innerHTML = "";

              if (result.detections.length === 0) {
                detectionsList.innerHTML = "<li>Tidak ada deteksi.</li>";

                // Tampilkan history table jika tidak ada deteksi
                if (result.history_table) {
                  historyContainer.innerHTML = result.history_table;
                }
              } else {
                result.detections.forEach((det) => {
                  const li = document.createElement("li");
                  li.textContent = `${det.label} (${(
                    det.confidence * 100
                  ).toFixed(1)}%)`;
                  detectionsList.appendChild(li);
                });
              }
            }
          } catch (err) {
            console.error("Gagal deteksi:", err);
          } finally {
            isProcessing = false;
            requestAnimationFrame(detectFrame);
          }
        }

        detectFrame();
      }

      // Update history setiap 2 detik (opsional)
      setInterval(async () => {
        try {
          const response = await fetch(HISTORY_URL);
          const result = await response.json();
          if (result.history_table && result.total_classes > 0) {
            historyContainer.innerHTML = result.history_table;
          }
        } catch (err) {
          console.error("Gagal update history:", err);
        }
      }, 2000);
    </script>
  </body>
</html>
